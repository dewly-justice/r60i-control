# XcodeGen spec for the menu-bar app. `make app` generates R60iControl.xcodeproj from this
# file and builds it; the .xcodeproj is not checked in.
name: R60iControl
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SoundcoreKit:
    path: SoundcoreKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    # Signing: the Makefile passes CODE_SIGN_IDENTITY (your "Apple Development" certificate
    # if there is one, otherwise ad hoc). A stable identity keeps the Bluetooth permission
    # across rebuilds.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  R60iControl:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SoundcoreKit
        product: SoundcoreKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: R60i Control
        CFBundleName: R60i Control
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "27.0"
        # Menu bar only: no Dock icon.
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: R60i Control talks to your Soundcore R60i NC earbuds over Bluetooth to show their battery and change their settings.
        NSHumanReadableCopyright: Personal use. Protocol knowledge from OpenSCQ30 (GPL-3.0).
    entitlements:
      path: App/R60iControl.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.R60iControl
        PRODUCT_NAME: R60i Control
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
